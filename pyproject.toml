[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "offline-mcp-builder"
version = "0.1.0"
description = "Offline FastMCP documentation and project builder"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==4.0.3", "numpy==2.5.3", "httpx==0.28.1", "cryptography==50.0.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6"]

[project.scripts]
mcp-builder = "mcp_builder.server:main"
index-mcp-docs = "mcp_builder.search.index:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_builder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
