services:
  mcp-builder:
    image: offline-mcp-builder:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      args:
        ENABLE_SEMANTIC: "0"
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PORT:-8000}:8000"
    environment:
      DOCS_DIR: /data
      MCP_PUBLIC_BIND_IP: ${MCP_BIND_IP:-127.0.0.1}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2000000}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  tests:
    profiles: [test]
    image: offline-mcp-builder-tests:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
      target: tests
    environment:
      RUFF_CACHE_DIR: /tmp/ruff-cache
      UV_CACHE_DIR: /tmp/uv-cache
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
