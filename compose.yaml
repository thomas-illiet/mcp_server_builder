services:
  mcp-builder:
    image: offline-mcp-builder:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      args:
        INDEX_THREADS: ${INDEX_THREADS:-2}
    ports:
      - "${MCP_BIND_IP:-0.0.0.0}:${MCP_PORT:-8000}:8000"
    environment:
      DOCS_DIR: /data
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-1}
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-2}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2000000}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped