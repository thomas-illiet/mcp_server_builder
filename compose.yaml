services:
  mcp-builder:
    image: offline-mcp-builder:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      args:
        OPENAI_BASE_URL: ${OPENAI_BASE_URL:?OPENAI_BASE_URL is required}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      secrets:
        - openai_api_key
    ports:
      - "${MCP_BIND_IP:-0.0.0.0}:${MCP_PORT:-8000}:8000"
    environment:
      DOCS_DIR: /data
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-60}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?OPENAI_BASE_URL is required}
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2000000}
    secrets:
      - openai_api_key
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  tests:
    profiles: [test]
    image: offline-mcp-builder-tests:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
      target: tests
    environment:
      RUFF_CACHE_DIR: /tmp/ruff-cache
      UV_CACHE_DIR: /tmp/uv-cache
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

secrets:
  openai_api_key:
    file: ${OPENAI_API_KEY_FILE_HOST:?OPENAI_API_KEY_FILE_HOST is required}
